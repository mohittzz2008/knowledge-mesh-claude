    { name = "sai venkata mohit", email = "mohittzz2008@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.0",
    "javalang>=0.13.0",
    "psycopg[binary]>=3,<4",
    "pycparser>=3.0",
    "pyjwt[crypto]>=2.8.0",
    "pydantic-settings>=2.15.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "sqlalchemy>=2,<3",
    "uvicorn[standard]>=0.52.4",
